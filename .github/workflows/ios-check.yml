name: iPhone simulator build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri -- ios init --ci
      - run: npm run tauri -- ios build --debug --target aarch64-sim --no-sign --archive-only --ci
      - uses: actions/upload-artifact@v4
        with:
          name: Catarse-iPhone-simulator-not-for-device
          path: src-tauri/gen/apple/build/**/*.app
          if-no-files-found: error
